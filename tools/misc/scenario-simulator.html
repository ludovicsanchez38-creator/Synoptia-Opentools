<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Scénarios - Business Tools</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="breadcrumb">
        <a href="../../index.html"><i class="fas fa-home"></i> Accueil</a> >
        <a href="../../index.html#tools">Divers</a> >
        <span>Simulateur Scénarios</span>
    </nav>
    <main class="tool-container">
        <header class="tool-header">
            <h1><i class="fas fa-project-diagram"></i> Simulateur de Scénarios</h1>
            <p class="tool-description">Comparez différents scénarios business (optimiste, réaliste, pessimiste).</p>
        </header>

        <section class="tool-input">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1.5rem 0;">
                <div class="form-group">
                    <label class="form-label">CA base (€)</label>
                    <input type="number" id="baseRevenue" class="form-input" value="100000" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Coûts fixes (€)</label>
                    <input type="number" id="fixedCosts" class="form-input" value="40000" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Coûts variables (%)</label>
                    <input type="number" id="variableCosts" class="form-input" value="30" min="0" max="100">
                </div>
            </div>

            <button class="btn btn-primary" id="calculateBtn">
                <i class="fas fa-sync"></i> Simuler les scénarios
            </button>
        </section>

        <section class="tool-output">
            <h3>📊 Comparaison des scénarios</h3>
            <div id="scenarios"></div>
        </section>

        <section class="tool-help">
            <h3><i class="fas fa-info-circle"></i> Scénarios</h3>
            <ul>
                <li><strong>Pessimiste</strong> : CA -30%, coûts +10%</li>
                <li><strong>Réaliste</strong> : Données de base</li>
                <li><strong>Optimiste</strong> : CA +30%, coûts -10%</li>
            </ul>
        </section>
    </main>
    <footer class="tool-footer">
        <a href="../../index.html"><i class="fas fa-arrow-left"></i> Retour</a>
    </footer>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        document.getElementById('calculateBtn').addEventListener('click', function() {
            const baseRev = parseFloat(document.getElementById('baseRevenue').value) || 0;
            const fixedCosts = parseFloat(document.getElementById('fixedCosts').value) || 0;
            const varCostsPct = parseFloat(document.getElementById('variableCosts').value) || 0;

            const scenarios = [
                { name: '😟 Pessimiste', revFactor: 0.7, costFactor: 1.1, color: '#ff6b6b' },
                { name: '📊 Réaliste', revFactor: 1.0, costFactor: 1.0, color: '#2196f3' },
                { name: '😊 Optimiste', revFactor: 1.3, costFactor: 0.9, color: '#4caf50' }
            ];

            const html = '<table style="width:100%;border-collapse:collapse;margin-top:1rem;">' +
                '<tr style="background:#f5f5f5;"><th style="padding:0.5rem;text-align:left;">Scénario</th><th style="padding:0.5rem;text-align:right;">CA</th><th style="padding:0.5rem;text-align:right;">Coûts</th><th style="padding:0.5rem;text-align:right;">Résultat</th><th style="padding:0.5rem;text-align:right;">Marge</th></tr>' +
                scenarios.map(function(s) {
                    const revenue = baseRev * s.revFactor;
                    const varCosts = revenue * (varCostsPct / 100);
                    const totalCosts = (fixedCosts * s.costFactor) + varCosts;
                    const result = revenue - totalCosts;
                    const margin = revenue > 0 ? (result / revenue) * 100 : 0;
                    
                    return '<tr style="border-left:4px solid ' + s.color + ';"><td style="padding:0.5rem;">' + s.name + '</td>' +
                        '<td style="padding:0.5rem;text-align:right;">' + formatCurrency(revenue) + '</td>' +
                        '<td style="padding:0.5rem;text-align:right;">' + formatCurrency(totalCosts) + '</td>' +
                        '<td style="padding:0.5rem;text-align:right;font-weight:700;color:' + (result >= 0 ? '#4caf50' : '#ff6b6b') + ';">' + formatCurrency(result) + '</td>' +
                        '<td style="padding:0.5rem;text-align:right;">' + margin.toFixed(1) + '%</td></tr>';
                }).join('') +
                '</table>';

            document.getElementById('scenarios').innerHTML = html;
            showNotification('Scénarios simulés !', 'success');
        });

        ['baseRevenue', 'fixedCosts', 'variableCosts'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', function() {
                document.getElementById('calculateBtn').click();
            });
        });

        document.getElementById('calculateBtn').click();
    </script>
</body>
</html>
