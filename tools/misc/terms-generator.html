<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur CGV - Business Tools</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" integrity="sha384-LhPJK12eZWQ+j+V7A48VQQnLzOLJB8C7wYvDWbdBxBh1QdXbYbYVZYY6YGnQgzEi==" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="breadcrumb" role="navigation" aria-label="Fil d'ariane">
        <a href="../../index.html"><i class="fas fa-home" aria-hidden="true"></i> Accueil</a> >
        <a href="../../index.html#tools">Divers</a> >
        <span>CGV</span>
    </nav>
    <main class="tool-container">
        <header class="tool-header">
            <h1><i class="fas fa-file-contract"></i> Générateur de CGV</h1>
            <p class="tool-description">Créez vos Conditions Générales de Vente.</p>
        </header>

        <section class="tool-input">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin: 1.5rem 0;">
                <div class="form-group">
                    <label class="form-label">Nom de l'entreprise</label>
                    <input type="text" id="company" class="form-input" value="Ma Société SARL">
                </div>
                <div class="form-group">
                    <label class="form-label">SIRET</label>
                    <input type="text" id="siret" class="form-input" value="123 456 789 00012">
                </div>
                <div class="form-group">
                    <label class="form-label">Adresse</label>
                    <input type="text" id="address" class="form-input" value="1 rue Example, 75001 Paris">
                </div>
                <div class="form-group">
                    <label class="form-label">Délai de livraison (jours)</label>
                    <input type="number" id="delivery" class="form-input" value="7" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Délai de paiement (jours)</label>
                    <input type="number" id="payment" class="form-input" value="30" min="0">
                </div>
            </div>

            <button class="btn btn-primary" id="generateBtn">
                <i class="fas fa-file-alt"></i> Générer les CGV
            </button>
        </section>

        <section class="tool-output">
            <div id="cgv" style="padding: 2rem; background: white; border-radius: var(--radius);"></div>
            <button class="btn btn-secondary" id="printBtn" style="margin-top: 1rem;">
                <i class="fas fa-print"></i> Imprimer
            </button>
        </section>

        <section class="tool-help">
            <h3><i class="fas fa-exclamation-triangle"></i> Avertissement</h3>
            <p>Ce générateur crée un document de base. Pour une utilisation professionnelle, consultez un avocat pour adapter les CGV à votre activité spécifique.</p>
        </section>
    </main>
    <footer class="tool-footer">
        <a href="../../index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Retour</a>
    </footer>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        document.getElementById('generateBtn').addEventListener('click', function() {
            const company = document.getElementById('company').value || 'Entreprise';
            const siret = document.getElementById('siret').value || 'N/A';
            const address = document.getElementById('address').value || 'N/A';
            const delivery = document.getElementById('delivery').value || '7';
            const payment = document.getElementById('payment').value || '30';
            const date = new Date().toLocaleDateString('fr-FR');

            const cgv = '<h2 style="text-align:center;margin-bottom:2rem;">CONDITIONS GÉNÉRALES DE VENTE</h2>' +
                '<div style="margin-bottom:2rem;"><strong>' + escapeHtml(company) + '</strong><br>SIRET : ' + escapeHtml(siret) + '<br>Adresse : ' + escapeHtml(address) + '</div>' +
                '<p style="margin-bottom:1rem;"><em>En vigueur au ' + date + '</em></p>' +
                '<h3>1. OBJET</h3><p>Les présentes Conditions Générales de Vente (CGV) régissent les ventes de produits et/ou services proposés par ' + escapeHtml(company) + '.</p>' +
                '<h3>2. PRIX</h3><p>Les prix sont indiqués en euros hors taxes. La TVA applicable sera ajoutée au moment de la facturation.</p>' +
                '<h3>3. COMMANDE</h3><p>Toute commande implique l\'acceptation sans réserve des présentes CGV.</p>' +
                '<h3>4. PAIEMENT</h3><p>Le paiement des factures est dû à ' + escapeHtml(payment) + ' jours. Tout retard de paiement entraînera l\'application de pénalités de retard.</p>' +
                '<h3>5. LIVRAISON</h3><p>Les délais de livraison sont de ' + escapeHtml(delivery) + ' jours ouvrés à compter de la validation de la commande.</p>' +
                '<h3>6. GARANTIES</h3><p>Les produits sont garantis conformément aux dispositions légales en vigueur.</p>' +
                '<h3>7. RESPONSABILITÉ</h3><p>' + escapeHtml(company) + ' ne saurait être tenue responsable de l\'inexécution du contrat en cas de force majeure.</p>' +
                '<h3>8. DROIT APPLICABLE</h3><p>Les présentes CGV sont soumises au droit français. Tout litige relève de la compétence des tribunaux français.</p>' +
                '<div style="margin-top:2rem;padding:1rem;background:#f5f5f5;border-radius:var(--radius);"><strong>Note :</strong> Ce document est fourni à titre informatif. Il est recommandé de faire valider vos CGV par un professionnel du droit.</div>';

            document.getElementById('cgv').innerHTML = cgv;
            showNotification('CGV générées !', 'success');
        });

        document.getElementById('printBtn').addEventListener('click', function() {
            window.print();
        });

        document.getElementById('generateBtn').click();
    </script>
</body>
</html>
