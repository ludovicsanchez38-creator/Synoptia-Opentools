<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Signature Email - Business Tools</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/tools.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" integrity="sha384-LhPJK12eZWQ+j+V7A48VQQnLzOLJB8C7wYvDWbdBxBh1QdXbYbYVZYY6YGnQgzEi==" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="breadcrumb">
        <a href="../../index.html"><i class="fas fa-home"></i> Accueil</a> >
        <a href="../../index.html#tools">Divers</a> >
        <span>Signature Email</span>
    </nav>
    <main class="tool-container">
        <header class="tool-header">
            <h1><i class="fas fa-envelope"></i> Générateur de Signature Email</h1>
            <p class="tool-description">Créez une signature professionnelle pour vos emails.</p>
        </header>

        <section class="tool-input">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin: 1.5rem 0;">
                <div class="form-group">
                    <label class="form-label">Nom complet</label>
                    <input type="text" id="name" class="form-input" value="Jean Dupont">
                </div>
                <div class="form-group">
                    <label class="form-label">Fonction</label>
                    <input type="text" id="job" class="form-input" value="Directeur Commercial">
                </div>
                <div class="form-group">
                    <label class="form-label">Entreprise</label>
                    <input type="text" id="company" class="form-input" value="Ma Société">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" value="jean.dupont@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Téléphone</label>
                    <input type="tel" id="phone" class="form-input" value="+33 6 12 34 56 78">
                </div>
                <div class="form-group">
                    <label class="form-label">Site web</label>
                    <input type="url" id="website" class="form-input" value="https://example.com">
                </div>
            </div>

            <button class="btn btn-primary" id="generateBtn">
                <i class="fas fa-sync"></i> Générer
            </button>
            <button class="btn btn-secondary" id="copyBtn" style="margin-left: 0.5rem;">
                <i class="fas fa-copy"></i> Copier HTML
            </button>
        </section>

        <section class="tool-output">
            <h3>Aperçu</h3>
            <div id="preview" style="padding: 1.5rem; background: white; border: 1px solid #ddd; border-radius: var(--radius);"></div>
        </section>

        <section class="tool-help">
            <h3><i class="fas fa-info-circle"></i> Utilisation</h3>
            <ol>
                <li>Remplissez vos informations</li>
                <li>Cliquez sur "Copier HTML"</li>
                <li>Collez dans les paramètres de signature de votre client email</li>
            </ol>
        </section>
    </main>
    <footer class="tool-footer">
        <a href="../../index.html"><i class="fas fa-arrow-left"></i> Retour</a>
    </footer>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        let signatureHTML = '';

        document.getElementById('generateBtn').addEventListener('click', generate);
        document.getElementById('copyBtn').addEventListener('click', copy);

        function generate() {
            const name = document.getElementById('name').value || 'Nom';
            const job = document.getElementById('job').value || 'Fonction';
            const company = document.getElementById('company').value || 'Entreprise';
            const email = document.getElementById('email').value || 'email@example.com';
            const phone = document.getElementById('phone').value || '';
            const website = document.getElementById('website').value || '';

            signatureHTML = '<table style="font-family:Arial,sans-serif;font-size:14px;color:#333;"><tr><td style="padding-right:20px;border-right:3px solid #2196f3;"><div style="font-size:18px;font-weight:700;margin-bottom:5px;">' + escapeHtml(name) + '</div><div style="color:#666;margin-bottom:5px;">' + escapeHtml(job) + '</div><div style="font-weight:700;">' + escapeHtml(company) + '</div></td><td style="padding-left:20px;"><div style="margin-bottom:5px;"><a href="mailto:' + escapeHtml(email) + '" style="color:#2196f3;text-decoration:none;">✉️ ' + escapeHtml(email) + '</a></div>' + (phone ? '<div style="margin-bottom:5px;">📞 ' + escapeHtml(phone) + '</div>' : '') + (website ? '<div><a href="' + escapeHtml(website) + '" style="color:#2196f3;text-decoration:none;">🌐 ' + escapeHtml(website) + '</a></div>' : '') + '</td></tr></table>';

            document.getElementById('preview').innerHTML = signatureHTML;
            showNotification('Signature générée !', 'success');
        }

        function copy() {
            navigator.clipboard.writeText(signatureHTML).then(function() {
                showNotification('HTML copié !', 'success');
            });
        }

        ['name', 'job', 'company', 'email', 'phone', 'website'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', generate);
        });

        generate();
    </script>
</body>
</html>
